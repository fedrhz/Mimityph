name: build
on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        shell: bash
        run: |
          ZIP=$(ls *.zip | head -n1)
          python3 -m zipfile -e "$ZIP" _unz
          ROOT=$(dirname "$(grep -rl --include=Cargo.toml '^\[workspace\]' _unz | head -n1)")
          mv "$ROOT" mimityph
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Тесты сервера
        working-directory: mimityph/server
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        shell: bash
        run: |
          ZIP=$(ls *.zip | head -n1)
          python3 -m zipfile -e "$ZIP" _unz
          ROOT=$(dirname "$(grep -rl --include=Cargo.toml '^\[workspace\]' _unz | head -n1)")
          mv "$ROOT" mimityph
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mimityph }
      - name: Тесты core
        working-directory: mimityph
        run: cargo test -p mimityph-core
      - name: Проверка компиляции приложения
        working-directory: mimityph
        run: cargo check -p mimityph-app

  windows-exe:
    needs: [rust-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        shell: bash
        run: |
          ZIP=$(ls *.zip | head -n1)
          python -m zipfile -e "$ZIP" _unz
          ROOT=$(dirname "$(grep -rl --include=Cargo.toml '^\[workspace\]' _unz | head -n1)")
          mv "$ROOT" mimityph
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mimityph }
      - run: cargo install dioxus-cli --locked
      - name: Сборка EXE
        working-directory: mimityph
        run: dx bundle --platform desktop --release -p mimityph-app
      - uses: actions/upload-artifact@v4
        with:
          name: mimityph-windows
          path: mimityph/target/dx/**/bundle/**
